name: Tests

on:
  push:
  pull_request:

# Actions are pinned to exact commits (with the version beside them), so a
# moved tag can't change what runs. Dependabot keeps them up to date.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false  # (one OS failing shouldn't hide how the others did)
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # some tests build the app's screens; there's no display here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      # Qt needs these even offscreen; the Ubuntu runner doesn't have them
      - name: Install the system libraries Qt needs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e . pytest pip-audit
      - run: pytest
      # known vulnerabilities in anything the app depends on fail the build
      - name: Check dependencies for known vulnerabilities
        run: pip-audit --skip-editable
