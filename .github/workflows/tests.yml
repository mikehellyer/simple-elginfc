name: Tests

on:
  push:
  pull_request:

# Actions are pinned to exact commits (with the version beside them), so a
# moved tag can't change what runs. Dependabot keeps them up to date.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e . pytest pip-audit
      - run: pytest
      # known vulnerabilities in anything the app depends on fail the build
      - name: Check dependencies for known vulnerabilities
        run: pip-audit --skip-editable
