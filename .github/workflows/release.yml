name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # build the installers without publishing a release

# Actions are pinned to exact commits (with the version beside them), so a
# moved tag can't change what runs. Dependabot keeps them up to date.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm packaging/pyinstaller/simple-elginfc.spec

      - name: Self-test the built app
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   dist/Simple-ElginFC/Simple-ElginFC --self-test ;;
            macOS)   dist/Simple-ElginFC.app/Contents/MacOS/Simple-ElginFC --self-test ;;
            Windows) powershell -Command '$p = Start-Process dist/Simple-ElginFC/Simple-ElginFC.exe -ArgumentList "--self-test" -Wait -PassThru; exit $p.ExitCode' ;;
          esac

      - name: Package (.deb)
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh

      - name: Package (.dmg)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\installer.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: simple-elginfc-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts

      # The app checks each download against these before installing it.
      - name: List the installers' SHA-256 checksums
        run: |
          find artifacts -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.exe' \) -exec sha256sum {} + \
            | sed 's|  .*/|  |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          generate_release_notes: true
